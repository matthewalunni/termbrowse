name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Several tests launch Chrome for Testing; cache the download between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/termbrowse
          key: chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: chrome-${{ runner.os }}-
      - run: npm test
