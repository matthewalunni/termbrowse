name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Several tests launch Chrome for Testing; cache the download between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/termbrowse
          key: chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: chrome-${{ runner.os }}-
      # Download Chrome for Testing before the tests, so no test's timeout includes it.
      - run: node --input-type=module -e "import { loadConfig } from './src/config.js'; import { ensureChrome } from './src/chrome.js'; await ensureChrome(await loadConfig());"
      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chrome's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The spec reporter prints failure details only in its summary at the end; the TAP copy has
      # them as they happen, and is uploaded even if the step fails or times out.
      - run: npm run test:ci
        timeout-minutes: 15
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results.tap
          if-no-files-found: ignore
